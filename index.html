<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>HYROX Daily — Patrick's Training Tracker</title>
<meta name="description" content="Daily HYROX training tracker — 13-week build to Race 1, 5-week bridge to Race 2.">
<meta name="theme-color" content="#0D0E10">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%230D0E10%22/><text x=%2250%22 y=%2266%22 font-size=%2255%22 font-family=%22Arial%22 font-weight=%22900%22 fill=%22%23FF6B35%22 text-anchor=%22middle%22>H</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app">

  <div id="profileScreen" class="profile-screen">
    <div class="profile-screen-inner">
      <div class="brand">HYROX <span>DAILY</span></div>
      <p class="profile-screen-sub">Who's training?</p>
      <div class="profile-list" id="profileList"></div>
      <div class="profile-add-row">
        <input type="text" id="newProfileName" placeholder="Add your name" maxlength="24" autocomplete="off">
        <button id="addProfileBtn">Add</button>
      </div>
    </div>
  </div>

  <div id="mainApp" hidden>

  <header class="app-header">
    <div class="header-top">
      <div class="brand-row">
        <div class="brand">HYROX <span>DAILY</span></div>
        <div class="profile-chip" id="activeProfileName">—</div>
      </div>
      <div class="header-actions">
        <button id="switchProfileBtn" class="ghost-btn">Switch</button>
        <button id="todayBtn" class="today-btn">Jump to Today</button>
      </div>
    </div>

    <div class="phase-card">
      <div class="phase-row">
        <div class="phase-name" id="phaseName">—</div>
        <div class="phase-week" id="phaseWeek">—</div>
      </div>
      <div class="phase-bar"><div class="phase-bar-fill" id="phaseBarFill" style="width:0%"></div></div>
      <div class="phase-meta">
        <span id="raceCountdown">—</span>
        <span id="adherenceStat">—</span>
      </div>
    </div>
  </header>

  <nav class="week-rail" id="weekRail" aria-label="This week"></nav>

  <main id="mainView">
    <div id="startBanner"></div>

    <div class="day-nav">
      <button class="day-nav-btn" id="prevDayBtn" aria-label="Previous day">‹</button>
      <div class="day-heading">
        <div class="dh-name" id="dhName">—</div>
        <div class="dh-date" id="dhDate">—</div>
      </div>
      <button class="day-nav-btn" id="nextDayBtn" aria-label="Next day">›</button>
    </div>

    <div class="swap-row">
      <button class="swap-toggle-btn" id="swapToggleBtn" hidden>⇄ Swap with another day this week</button>
      <div class="swap-locked-note" id="swapLockedNote" hidden>Swapping is locked during race week.</div>
    </div>
    <div class="swap-panel" id="swapPanel" hidden></div>

    <div class="holiday-row" id="holidayRow">
      <button class="holiday-toggle-btn" id="holidayToggleBtn">🏖 Mark as Holiday Mode</button>
    </div>
    <div class="holiday-panel" id="holidayPanel" hidden>
      <p class="holiday-panel-text">This day is excused — it won't break your streak or count against adherence.</p>
      <input type="text" id="holidayReasonInput" placeholder="Reason (optional) — e.g. travelling, no gym access" maxlength="80" autocomplete="off">
    </div>

    <section class="session-card" id="sessionCard">
      <span class="session-tag" id="sessionTag">—</span>
      <span class="swapped-badge" id="swappedBadge" hidden>⇄ moved</span>
      <h1 class="session-title" id="sessionTitle">—</h1>
      <p class="session-subtitle" id="sessionSubtitle"></p>
      <div class="station-rail" id="stationRail"></div>
    </section>
  </main>

  <footer class="app-footer">
    <div class="streak-row">
      <div class="streak-card">
        <div class="streak-num" id="streakNum">0</div>
        <div class="streak-label">Day Streak</div>
      </div>
      <div class="streak-card">
        <div class="streak-num" id="doneCount">0</div>
        <div class="streak-label">Sessions Done</div>
      </div>
      <div class="streak-card">
        <div class="streak-num" id="pctNum">0%</div>
        <div class="streak-label">Block Adherence</div>
      </div>
    </div>
  </footer>

  </div>

</div>

<script src="js/pictograms.js"></script>
<script src="js/program-data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
